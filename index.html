let currentPage='overview';let students=[
 {name:'Aarav Sharma',id:'SC2026001',course:'B.Sc. IT',year:'Second Year',status:'Active',initials:'AS',color:'#e8edff',ink:'#5268d9'},

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function avatar(name,initials,color,ink){return `<div class="avatar" style="background:${color||'#e8edff'};color:${ink||'#536ce4'}">${initials||name.split(' ').map(x=>x[0]).slice(0,2).join('')}</div>`}

function statCard(label,value,icon,style,trend,foot){return `<article class="stat-card"><div class="stat-top"><span class="stat-label">${label}</span><div class="stat-icon ${style}">${icon}</div></div><div class="stat-value">${value}</div><div class="stat-foot"><span class="trend ${trend.startsWith('~')?'neutral':''}">${trend.replace('~','')}</span><span>${foot}</span></div></article>`}
function header(title,sub,actions=''){return `<div class="section-header"><div><h2>${title}</h2><p>${sub}</p></div><div class="toolbar">${actions}</div></div>`}

">WED</text><text x="332" y="211">THU</text><text x="428" y="211">FRI</text><text x="524" y="211">SAT</text><text x="615" y="211">SUN</text></g></svg></div></section>

function studentsPage(){return `${header('Students','Manage student profiles and enrollment records.',button('Export CSV','exportStudents()',false,icons.download)+button('Add student','openModal(\'student\')',true,icons.plus))}<div class="panel table-panel wide-table"><div class="panel-head"><div><h3 class="panel-title">Student Directory</h3><div class="panel-subtitle">${students.length} sample records in this dashboard</div></div><div class="toolbar"><input id="studentSearch" placeholder="Search students..." oninput="renderStudentRows()"><select id="studentFilter" onchange="renderStudentRows()"><option value="All">All statuses</option><option>Active</option><option>Pending</option><option>Inactive</option></select></div></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Student</th><th>Student ID</th><th>Course</th><th>Year</th><th>Status</th><th>Action</th></tr></thead><tbody id="studentRows"></tbody></table></div><div class="table-footer"><span id="studentCount"></span><span>Demo data · Changes are in this browser session only</span></div></div><div class="notice-strip"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>This student directory is a front-end demo. Connect your API to read and save actual student records.</span></div>`}
function renderStudentRows(){let q=(document.getElementById('studentSearch')?.value||'').toLowerCase();let f=document.getElementById('studentFilter')?.value||'All';let list=students.filter(s=>(f==='All'||s.status===f)&&[s.name,s.id,s.course,s.year].some(v=>v.toLowerCase().includes(q)));let tbody=document.getElementById('studentRows');if(!tbody)return;tbody.innerHTML=list.length?list.map((s)=>`<tr><td><div class="person-cell">${avatar(s.name,s.initials,s.color,s.ink)}<div><strong>${esc(s.name)}</strong><span>${s.id}@smartcampus.demo</span></div></div></td><td>${s.id}</td><td>${esc(s.course)}</td><td>${esc(s.year)}</td><td>${statusPill(s.status)}</td><td><button class="text-link" onclick="showToast('Demo record: ${esc(s.name)}')">View</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty-state">No students match this search.</div></td></tr>`;document.getElementById('studentCount').textContent=`Showing ${list.length} of ${students.length} students`;}
function facultyPage(){const fac=[['Dr. Neha Shah','Information Technology','IT-104','Available'],['Prof. Rahul Kulkarni','Commerce','CM-209','Available'],['Prof. Sameer Rao','Computer Science','CS-116','In class'],['Dr. Maria Fernandes','Arts & Humanities','AH-302','Available'],['Prof. Priya Nair','Data Science','DS-118','On leave']];return `${header('Faculty','Faculty directory and department overview.',button('Add faculty','showToast(\'Connect the faculty form to your API to add real records.\')',true,icons.plus))}<div class="stats">${statCard('Total Faculty','86',icons.faculty,'ic-blue','↑ 3.4%','since last semester')}${statCard('Departments','8',icons.courses,'ic-purple','~Stable','academic departments')}${statCard('Available Today','72',icons.check,'ic-green','83.7%','of total faculty')}${statCard('On Leave','4',icons.calendar,'ic-amber','~Stable','today')}</div><div class="panel table-panel"><div class="panel-head"><div><h3 class="panel-title">Faculty Directory</h3><div class="panel-subtitle">Sample faculty records</div></div><input id="facultySearch" placeholder="Search faculty..." oninput="filterTable('facultySearch','facultyRows')" style="border:1px solid #e4e9f1;border-radius:8px;padding:9px 11px;font-size:11px"></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Faculty member</th><th>Department</th><th>Faculty ID</th><th>Availability</th></tr></thead><tbody id="facultyRows">${fac.map((f,i)=>`<tr><td><div class="person-cell">${avatar(f[0],null,['#e8edff','#e4f8ef','#fff0e4','#f2eaff'][i%4],['#536ce4','#1a9a76','#cb7b35','#8861cd'][i%4])}<div><strong>${f[0]}</strong><span>Faculty member</span></div></div></td><td>${f[1]}</td><td>${f[2]}</td><td>${statusPill(f[3]==='Available'?'Active':f[3]==='On leave'?'Inactive':'Pending')}</td></tr>`).join('')}</tbody></table></div></div><div class="footer"><span>Sample information displayed for layout preview.</span><span>Smart Campus</span></div>`}
function coursesPage(){return `${header('Courses','View courses, enrollment and course progress.',button('Add course','showToast(\'Course management can be connected to your backend.\')',true,icons.plus))}<div class="courses-grid">${courses.map(c=>`<article class="course-card"><div class="course-color" style="background:${c.color};color:${c.ink}">${c.symbol}</div><h3>${c.title}</h3><p>${c.code} · ${c.faculty}</p><div class="course-meta"><span>${c.students} students</span><strong>${c.progress}% progress</strong></div><div class="progress"><span style="width:${c.progress}%;background:${c.ink}"></span></div><div style="display:flex;justify-content:space-between;margin-top:15px;font-size:10px;color:#8b97a8"><span>Course status</span><span style="color:#159b72;font-weight:750">Active</span></div></article>`).join('')}</div><div class="footer"><span>Enrollment numbers are illustrative demo values.</span><span>Smart Campus</span></div>`}

function reportsPage(){return `${header('Reports & Analytics','Export sample summaries or connect reports to live data.',button('Export students CSV','exportStudents()',true,icons.download))}<div class="report-grid"><div class="report-card"><div class="stat-icon ic-blue" style="margin-bottom:15px">${icons.users}</div><h3>Student Directory</h3><p>Download a CSV file containing the sample student records currently shown in this demo.</p>${button('Download CSV','exportStudents()',false,icons.download)}</div><div class="report-card"><div class="stat-icon ic-green" style="margin-bottom:15px">${icons.check}</div><h3>Attendance Summary</h3><p>Download a short illustrative attendance summary for use while testing the dashboard.</p>${button('Download summary','exportReport()',false,icons.download)}</div><div class="report-card"><div class="stat-icon ic-purple" style="margin-bottom:15px">${icons.courses}</div><h3>Course Overview</h3><p>Review course names, enrollments and indicative completion progress.</p>${button('View courses','navigate(\'courses\')',false)}</div><div class="report-card"><div class="stat-icon ic-amber" style="margin-bottom:15px">${icons.calendar}</div><h3>Campus Calendar</h3><p>Upcoming events and sample academic activities for this dashboard preview.</p>${button('View events','showToast(\'Calendar preview is available on the overview page.\')',false)}</div></div><div class="notice-strip" style="margin-top:18px"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>All reports use illustrative data. They are not official institutional records.</span></div>`}
function settingsPage(){return `${header('Settings','Edit local demo preferences and portal profile details.')}<div class="settings-grid"><section class="panel setting-panel"><h3>Campus profile</h3><form id="profileForm" onsubmit="saveSettings(event)"><div class="field"><label>Campus name</label><input name="campus" value="Smart Campus" required></div><div class="field"><label>Administrator display name</label><input name="admin" value="Campus Admin" required></div><div class="field"><label>Mentor name</label><input name="mentor" value="Mr. Prateek Yadav"></div><div class="field"><label>Project website</label><input name="website" type="url" value="https://smart-campus-management-rouge.vercel.app"></div><button class="btn btn-primary" type="submit">Save local settings</button></form></section><section class="panel setting-panel"><h3>Preferences</h3><div class="switch-row"><span>Email notification previews</span><input class="switch" type="checkbox" checked></div><div class="switch-row"><span>Show dashboard tips</span><input class="switch" type="checkbox" checked></div><div class="switch-row"><span>Weekly attendance summary</span><input class="switch" type="checkbox"></div><div class="switch-row"><span>Compact tables</span><input class="switch" type="checkbox"></div><p style="font-size:10px;color:#9aa4b2;line-height:1.6;margin-top:17px">Preferences are visual demo controls and are not saved to a server.</p></section></div><div class="footer"><span>Settings are local to this static prototype.</span><span>Smart Campus</span></div>`}
function renderPage(page){currentPage=page;const titles={overview:['Overview','Dashboard Overview'],students:['Students','Student Management'],faculty:['Faculty','Faculty Management'],courses:['Courses','Course Management'],attendance:['Attendance','Attendance Management'],notices:['Notices','Notices & Announcements'],reports:['Reports','Reports & Analytics'],settings:['Settings','Settings']};document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('crumb').textContent=titles[page][0];document.getElementById('pageHeading').textContent=titles[page][1];const renderers={overview:overviewPage,students:studentsPage,faculty:facultyPage,courses:coursesPage,attendance:attendancePage,notices:noticesPage,reports:reportsPage,settings:settingsPage};document.getElementById('pageContent').innerHTML=renderers[page]();if(page==='students')renderStudentRows();document.getElementById('globalSearch').value='';document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'});}
function navigate(page){if(!['overview','students','faculty','courses','attendance','notices','reports','settings'].includes(page))return;renderPage(page)}
function showToast(message){let t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>t.classList.remove('show'),2800)}
function openModal(type){const backdrop=document.getElementById('modalBackdrop'),title=document.getElementById('modalTitle'),form=document.getElementById('modalForm');if(type==='student'){title.textContent='Add a student';form.innerHTML=`<div class="field"><label>Full name</label><input name="name" placeholder="e.g. Aditi Sharma" required></div><div class="field"><label>Student ID</label><input name="id" placeholder="e.g. SC2026010" required></div><div class="field"><label>Course</label><select name="course"><option>B.Sc. IT</option><option>B.Com</option><option>B.Sc. CS</option><option>BMS</option><option>B.Sc. Data Science</option></select></div><div class="field"><label>Year</label><select name="year"><option>First Year</option><option>Second Year</option><option>Third Year</option></select></div><div class="field"><label>Status</label><select name="status"><option>Active</option><option>Pending</option><option>Inactive</option></select></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Add to demo list</button></div>`;form.onsubmit=(e)=>{e.preventDefault();const d=new FormData(form);let name=d.get('name').trim(),id=d.get('id').trim();if(students.some(s=>s.id.toLowerCase()===id.toLowerCase())){showToast('That student ID already exists in the demo list.');return;}if(!name||!id)return;let initials=name.split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase(),colors=[['#e8edff','#5268d9'],['#e5f8f0','#1a9a76'],['#fff0e4','#cb7b35'],['#f0eaff','#8861cd']][students.length%4];students.unshift({name,id,course:d.get('course'),year:d.get('year'),status:d.get('status'),initials,color:colors[0],ink:colors[1]});closeModal();navigate('students');showToast('Student added to the temporary demo list.');};}else{title.textContent='Create a notice';form.innerHTML=`<div class="field"><label>Notice title</label><input name="title" placeholder="Enter notice title" required></div><div class="field"><label>Message</label><textarea name="desc" placeholder="Write a short announcement" required></textarea></div><div class="field"><label>Category</label><select name="tag"><option>Academic</option><option>Facility</option><option>Reminder</option><option>Event</option></select></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Publish demo notice</button></div>`;form.onsubmit=e=>{e.preventDefault();const d=new FormData(form);notices.unshift({title:d.get('title').trim(),desc:d.get('desc').trim(),tag:d.get('tag'),date:'Just now'});closeModal();navigate('notices');showToast('Notice added to the temporary demo list.');};}backdrop.classList.add('open');setTimeout(()=>form.querySelector('input')?.focus(),70)}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}
function exportCSV(filename,rows){const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showToast('CSV export downloaded.')}
function exportStudents(){exportCSV('smart-campus-students-demo.csv',[['Name','Student ID','Course','Year','Status'],...students.map(s=>[s.name,s.id,s.course,s.year,s.status])])}
function exportReport(){exportCSV('smart-campus-attendance-demo.csv',[['Report','Value','Note'],['Average attendance','92.6%','Illustrative demo value'],['Present today','1156','Illustrative demo value'],['Absent today','92','Illustrative demo value'],['Campus','Smart Campus','Sample report']])}
function filterTable(inputId,tbodyId){let q=document.getElementById(inputId).value.toLowerCase();document.querySelectorAll(`#${tbodyId} tr`).forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')}
function saveSettings(e){e.preventDefault();const d=new FormData(e.target);document.querySelector('.brand-title').textContent=d.get('campus');document.querySelector('.side-user strong').textContent=d.get('admin');document.querySelector('.profile-name').textContent=d.get('admin');showToast('Settings updated for this page session.');}
document.getElementById('mainNav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)});document.getElementById('mobileToggle').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('mobileOverlay').classList.add('show')});document.getElementById('mobileOverlay').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('show')});document.getElementById('closeModal').addEventListener('click',closeModal);document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.getElementById('notifyBtn').addEventListener('click',()=>showToast('You are all caught up on demo notifications.'));document.getElementById('helpBtn').addEventListener('click',()=>showToast('Ask your campus administrator for portal support.'));document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(!q)return;if(currentPage!=='students')navigate('students');const box=document.getElementById('studentSearch');if(box){box.value=q;renderStudentRows();if(!students.some(s=>[s.name,s.id,s.course,s.year].some(v=>v.toLowerCase().includes(q.toLowerCase()))))showToast('No matching sample student record.');}}});document.addEventListener('change',e=>{if(e.target.id==='chartPeriod'){const month=e.target.value==='month',pts=month?'55,82 151,95 247,70 343,89 439,58 535,72 625,52':'55,115 151,91 247,103 343,66 439,81 535,56 625,71';let pair=pts.split(' ').map(p=>p.split(',').map(Number));document.getElementById('chartLine').setAttribute('points',pts);document.getElementById('chartArea').setAttribute('d',`M${pair[0][0]} ${pair[0][1]} ${pair.slice(1).map(p=>`L${p[0]} ${p[1]}`).join(' ')} L625 185 L55 185Z`);document.getElementById('chartDots').innerHTML=pair.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4"/>`).join('');}});
renderPage('overview');
</script>
</body>
</html>
